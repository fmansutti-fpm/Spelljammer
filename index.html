function coinifyText(html){return String(html??'').replace(/\b(cp|sp|gp|pp)\b/gi,(m)=>`<span class="coin ${m.toLowerCase()}">${m.toLowerCase()}</span>`)}
function fmt(v){return coinifyText(esc(v))}
function val(o,keys){for(const k of keys){if(o && o[k]!=null)return o[k]}return ''}
function money(o){let a=val(o,['Cost x1','Price']);let c=val(o,['Colonna 2','Currency']);return a?`${a} ${c||''}`:''}
function priceOf(o){let amount=Number(val(o,['Cost x1','Price'])||0);let currency=String(val(o,['Colonna 2','Currency'])||'').toLowerCase().trim();return amount>0&&['cp','sp','gp','pp'].includes(currency)?{amount,currency}:null}
function itemName(o){return val(o,['Item Name','Result','Equipment Category','Types of coins'])}
function findCatalogItem(name){return allItems().find(x=>itemName(x)===name)||C.recipes.find(x=>x.Result===name)||null}
function itemPrice(name){return priceOf(findCatalogItem(name)||{})}
function priceHtml(name){let p=itemPrice(name);return p?fmt(`${p.amount} ${p.currency}`):'<span class="muted price-missing">—</span>'}
function saveWallet(){store.set('wallet',state.wallet)}
function walletInput(unit){return `<div class="wallet-card"><label>${coinifyText(unit)} posseduti</label><input class="input" type="number" min="0" step="1" value="${esc(state.wallet[unit]||0)}" onchange="setWallet('${unit}',this.value)"></div>`}
function walletPanel(){return `<div class="card"><h2>Monete possedute</h2><p class="muted mini">Modifica liberamente i valori. Acquisto e vendita usano la valuta del prezzo dell'oggetto.</p><div class="wallet-grid">${['cp','sp','gp','pp'].map(walletInput).join('')}</div></div>`}
function table(rows, cols=null){ if(!rows?.length)return '<p class="muted">Nessun dato.</p>'; cols=cols||Object.keys(rows[0]); return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${fmt(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function gridTable(rows){return `<div class="tablewrap"><table><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function allItems(){return [...C.materials.map(x=>({...x,_type:'Materiale'})),...C.organics.map(x=>({...x,_type:'Organico'})),...C.energy.map(x=>({...x,_type:'Energia'})),...C.food.map(x=>({...x,_type:'Cibo'}))]}
function recipeReqs(r){const pairs=[['Material','Qty'],['Material 2','Qty 2'],['Organic','Qty 3'],['Organic 2','Qty 4'],['Energy','Qty 5'],['Energy 2','Qty 6']]; return pairs.map(([n,q])=>({name:r[n],qty:Number(r[q]||0)})).filter(x=>x.name&&x.name!='-'&&x.qty>0)}
function setTab(id){state.tab=id; $$('.section').forEach(x=>x.classList.toggle('active',x.id===id)); $$('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.tab===id)); renderSection(id)}
function initNav(){ $('#nav').innerHTML=tabs.map(([id,l])=>`<button class="navbtn ${id==='dashboard'?'active':''}" data-tab="${id}">${l}</button>`).join(''); $$('.navbtn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));}
function statCards(){let items=allItems(); return `<div class="grid cols3"><div class="card"><div class="muted">Materiali / risorse</div><div class="kpi">${items.length}</div></div><div class="card"><div class="muted">Ricette</div><div class="kpi">${C.recipes.length}</div></div><div class="card"><div class="muted">Attività viaggio</div><div class="kpi">${S.attivita.length}</div></div></div>`}
function renderDashboard(){ $('#dashboard').innerHTML=`<div class="hero"><h1>Console della Nave</h1><p class="muted">Una web app sincronizzata online per gestire il sistema di viaggio Spelljammer, eventi, crafting, ricette e inventario della campagna.</p><div class="toolbar"><button class="btn primary" onclick="setTab('events')">Tira evento di rotta</button><button class="btn" onclick="setTab('recipes')">Consulta ricette</button><button class="btn" onclick="setTab('travel')">Gestisci turni</button></div></div>${statCards()}<div class="grid cols2" style="margin-top:16px"><div class="card"><h2>Ultimi eventi</h2><div class="log">${state.log.slice(0,6).map(logHtml).join('')||'<p class="muted">Nessun evento registrato.</p>'}</div></div><div class="card"><h2>Attività di viaggio</h2><div class="cards">${S.attivita.slice(0,4).map(a=>`<div class="item-card"><h3>${esc(a.Attività)}</h3><p class="muted mini">${esc(a['Cosa Produce'])}</p><span class="pill">${esc(a.Costo)}</span></div>`).join('')}</div></div></div>`}
const ROUTE_REQ={"Calma":{man:1,morale:1},"Tier I":{man:2,morale:2},"Tier II":{man:4,morale:3},"Tier III":{man:6,morale:4}};
const ZONE_REQ={"Tranquilla":{sic:1,morale:1},"Trafficata":{sic:2,morale:2},"Pericolosa":{sic:3,morale:3},"Ostile":{sic:4,morale:4}};
const ACTIVITY_COLS=['Addestramento','Ricerca','Manutenzione','Socializzare','Recupero','Crafting','Sicurezza','Morale'];
function n(v){let x=Number(v); return Number.isFinite(x)?x:0}
function initTravelState(){
  if(!state.turns){state.turns=S.tracker.slice(0,12).map((x,i)=>({Turno:x.Turno||i+1,'Condizione Rotta':x['Condizione Rotta']||'Calma',Zona:x.Zona||'Tranquilla','Durata Narrativa':x['Durata Narrativa']||''})); store.set('turns',state.turns)}
  state.turns=state.turns.map((x,i)=>({Turno:x.Turno||i+1,'Condizione Rotta':ROUTE_REQ[x['Condizione Rotta']]?x['Condizione Rotta']:'Calma',Zona:ZONE_REQ[x.Zona]?x.Zona:'Tranquilla','Durata Narrativa':x['Durata Narrativa']||''}));
  if(!state.allocations){state.allocations=S.allocazione.slice(0,84).map(x=>({...x})); store.set('allocations',state.allocations)}
  state.allocations=state.allocations.map(x=>{let y={...x}; ACTIVITY_COLS.forEach(k=>y[k]=n(y[k])); y['Note / Progetto']=y['Note / Progetto']||''; return y});
}
function calcTurn(r){
  let condition=ROUTE_REQ[r['Condizione Rotta']]?r['Condizione Rotta']:'Calma', zone=ZONE_REQ[r.Zona]?r.Zona:'Tranquilla';
  let rows=state.allocations.filter(a=>String(a.Turno)===String(r.Turno));
  let manO=rows.reduce((t,a)=>t+n(a.Manutenzione),0);
  let sicO=rows.reduce((t,a)=>t+n(a.Sicurezza),0);
  let morO=rows.reduce((t,a)=>t+n(a.Socializzare)+n(a.Morale),0);
  let manR=ROUTE_REQ[condition].man, sicR=ZONE_REQ[zone].sic, morR=ROUTE_REQ[condition].morale+ZONE_REQ[zone].morale;
  let mod=(morO<morR?-2:0)+(manO<manR?-3:0)+(sicO<sicR?-4:0)+Math.floor((Math.max(0,manO-manR)+Math.max(0,sicO-sicR)+Math.max(0,morO-morR))/2);
  let ok=[manO>=manR,sicO>=sicR,morO>=morR].filter(Boolean).length;
  return {...r,'Condizione Rotta':condition,Zona:zone,'Manut. Rich.':manR,'Manut. Ottenuta':manO,'Sic. Rich.':sicR,'Sic. Ottenuta':sicO,'Morale Rich.':morR,'Morale Ottenuto':morO,'Mod Evento':mod,_ok:ok};
}
function renderTravel(){ initTravelState(); const cols=['Turno','Condizione Rotta','Zona','Manut. Rich.','Manut. Ottenuta','Sic. Rich.','Sic. Ottenuta','Morale Rich.','Morale Ottenuto','Mod Evento']; $('#travel').innerHTML=`<div class="hero"><h1>Viaggio Spelljammer <span class="versiontag">v10 realtime</span></h1><p class="muted">Tracker turni automatico: puoi modificare solo <strong>Condizione Rotta</strong> e <strong>Zona</strong>. Le soglie richieste, i valori ottenuti e il modificatore evento si aggiornano dalla tabella Allocazione PG. Morale Ottenuto = Socializzare + Morale del turno.</p><div class="toolbar"><button class="btn primary" onclick="saveTravel()">Salva ora</button><button class="btn danger" onclick="resetTravel()">Reset viaggio</button></div></div><div class="card"><h2>Tracker turni</h2><div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Esito</th></tr></thead><tbody id="trackerBody">${state.turns.map((r,i)=>turnRow(r,i)).join('')}</tbody></table></div><p class="muted mini">Formula Mod Evento: -2 se Morale insufficiente, -3 se Manutenzione insufficiente, -4 se Sicurezza insufficiente, +1 ogni 2 punti di surplus complessivo.</p></div><div class="card" style="margin-top:16px"><h2>Allocazione PG</h2><p class="muted">Usa le freccette dei campi numerici per aumentare o diminuire di 1. Il totale speso e il tracker si aggiornano automaticamente.</p><div class="tablewrap"><table><thead><tr>${['Turno','PG',...ACTIVITY_COLS,'Totale Speso','Note / Progetto'].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody id="allocationBody">${state.allocations.map((r,i)=>allocationRow(r,i)).join('')}</tbody></table></div></div>`}
function selectHtml(value, options, attrs){return `<select class="select" ${attrs}>${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
function turnRow(r,i){let c=calcTurn(r), cls=c._ok===3?'ok':c._ok>=1?'warn':'bad'; return `<tr data-i="${i}"><td>${esc(c.Turno)}</td><td>${selectHtml(c['Condizione Rotta'],Object.keys(ROUTE_REQ),`onchange="updateTurnField(${i},'Condizione Rotta',this.value)"`)}</td><td>${selectHtml(c.Zona,Object.keys(ZONE_REQ),`onchange="updateTurnField(${i},'Zona',this.value)"`)}</td>${['Manut. Rich.','Manut. Ottenuta','Sic. Rich.','Sic. Ottenuta','Morale Rich.','Morale Ottenuto','Mod Evento'].map(k=>`<td class="locked"><span class="calc-cell ${k.includes('Rich')?'warn':''}">${esc(c[k])}</span></td>`).join('')}<td><span class="pill ${cls}">${c._ok}/3 soglie</span></td></tr>`}
function allocationRow(r,i){let total=ACTIVITY_COLS.reduce((t,k)=>t+n(r[k]),0); return `<tr data-ai="${i}"><td>${esc(r.Turno)}</td><td>${esc(r.PG)}</td>${ACTIVITY_COLS.map(k=>`<td><input class="editable" type="number" min="0" step="1" value="${n(r[k])}" oninput="updateAllocation(${i},'${k}',this.value)"></td>`).join('')}<td><span class="pill ${total>3?'bad':total===3?'ok':'warn'}" id="alloc-total-${i}">${total}</span></td><td><input class="input" style="min-width:180px" value="${esc(r['Note / Progetto']||'')}" onchange="updateAllocationNote(${i},this.value)"></td></tr>`}
window.updateTurnField=(i,k,v)=>{state.turns[i][k]=v; localSet('turns',state.turns); saveTravel(false); $('#trackerBody').innerHTML=state.turns.map((r,i)=>turnRow(r,i)).join('')}
window.updateAllocation=(i,k,v)=>{state.allocations[i][k]=n(v); localSet('allocations',state.allocations); let tr=document.querySelector(`tr[data-ai="${i}"]`); if(tr){let total=ACTIVITY_COLS.reduce((t,key)=>t+n(state.allocations[i][key]),0), el=document.getElementById(`alloc-total-${i}`); if(el){el.textContent=total; el.className=`pill ${total>3?'bad':total===3?'ok':'warn'}`}} saveTravel(false); $('#trackerBody').innerHTML=state.turns.map((r,i)=>turnRow(r,i)).join('')}
window.updateAllocationNote=(i,v)=>{state.allocations[i]['Note / Progetto']=v; localSet('allocations',state.allocations); saveTravel(false)}
window.saveTravel=(notify=true)=>{
  localSet('turns',state.turns);
  localSet('allocations',state.allocations);
  if(remoteRef&&remoteReady&&!applyingRemote){
    remoteRef.update({turns:state.turns||null,allocations:state.allocations||null,updatedAt:new Date().toISOString()})
      .catch(e=>{console.error(e);setSyncStatus('Errore salvataggio viaggio','bad')});
  }
  if(notify)alert('Viaggio salvato online.');
}
window.resetTravel=()=>{ if(confirm('Ripristinare tracker e allocazione PG dai dati Excel?')){state.turns=null; state.allocations=null; store.remove('turns'); store.remove('allocations'); initTravelState(); pushRemoteNow(); renderTravel()}}
function eventRows(){return S.eventi.filter(e=>['Complicazione grave','Complicazione minore','Nessun evento importante','Opportunità','Scoperta rara'].includes(e['Tipo Evento']))}
function selectedEventTurn(){let v=Number($('#eventTurn')?.value||1); return Math.min(12,Math.max(1,v))}
function eventModForTurn(turn){initTravelState(); let row=state.turns.find(r=>Number(r.Turno)===Number(turn))||state.turns[turn-1]||state.turns[0]; return calcTurn(row)['Mod Evento']||0}
window.updateEventTurnPreview=()=>{let turn=selectedEventTurn(), mod=eventModForTurn(turn), box=$('#eventModPreview'); if(box)box.innerHTML=`Mod Evento turno ${turn}: <strong>${mod>=0?'+':''}${mod}</strong>`}
function renderEvents(){ initTravelState(); let cleanEvents=eventRows(); $('#events').innerHTML=`<div class="hero"><h1>Generatore Eventi di Rotta <span class="versiontag">v10 realtime</span></h1><p class="muted">Scegli il turno dell'evento: il tiro userà automaticamente il <strong>Mod Evento</strong> calcolato nella sezione Viaggio per quel turno.</p><div class="toolbar"><label class="muted mini" for="eventTurn">Turno evento</label><select id="eventTurn" class="select" onchange="updateEventTurnPreview()">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select><span id="eventModPreview" class="pill"></span></div><div class="toolbar"><button class="btn primary" onclick="rollEvent()">Tira d20</button><button class="btn" onclick="clearLog()">Svuota diario</button></div><div id="rollResult"></div></div><div class="grid cols2"><div class="card"><h2>Tabella eventi</h2>${table(cleanEvents,['Tiro d20 modificato','Tipo Evento','Descrizione','Intensità'])}</div><div class="card"><h2>Diario eventi</h2><div class="log" id="eventLog">${state.log.map(logHtml).join('')||'<p class="muted">Nessun evento.</p>'}</div></div></div>`; updateEventTurnPreview();}
function parseRange(s){let m=String(s).match(/(-?\d+)\s*[–-]\s*(-?\d+)/); if(m)return [+m[1],+m[2]]; m=String(s).match(/(-?\d+)/); if(m)return [+m[1],+m[1]]; return [-999,999]}
function eventFor(total){let rows=eventRows(); return rows.find(e=>{let [a,b]=parseRange(e['Tiro d20 modificato']); return total>=a&&total<=b})||rows[rows.length-1]}
window.rollEvent=()=>{let turn=selectedEventTurn(), d=1+Math.floor(Math.random()*20), mod=eventModForTurn(turn), total=d+mod, e=eventFor(total); let entry={time:new Date().toLocaleString('it-IT'), turn, d, mod, total, type:e['Tipo Evento'], desc:e.Descrizione, intensity:e['Intensità']}; state.log.unshift(entry); store.set('routeLog',state.log); $('#rollResult').innerHTML=`<div class="card"><div class="muted">Risultato turno ${turn}</div><div class="dice">${d} ${mod>=0?'+':''}${mod} = ${total}</div><h2>${esc(entry.type)}</h2><p>${esc(entry.desc)}</p><span class="pill ${entry.type?.includes('grave')?'bad':entry.type?.includes('minore')?'warn':'ok'}">${esc(entry.intensity)}</span></div>`; $('#eventLog').innerHTML=state.log.map(logHtml).join(''); updateEventTurnPreview();}
function logHtml(x){return `<div class="logitem"><strong>${esc(x.type)}</strong> <span class="pill">${esc(x.total??'')}</span><br><span class="muted mini">${esc(x.time)}${x.turn?` · turno ${esc(x.turn)}`:''} · d20 ${esc(x.d)} ${x.mod>=0?'+':''}${esc(x.mod)}</span><p>${esc(x.desc)}</p></div>`}
window.clearLog=()=>{ if(confirm('Svuotare il diario eventi?')){state.log=[]; store.set('routeLog',state.log); renderEvents();}}
function renderCrafting(){let items=allItems(); let tiers=[...new Set(items.map(x=>x.Tier).filter(Boolean))]; let q=state.q.toLowerCase(); let filtered=items.filter(x=>(state.craftType==='all'||x._type===state.craftType)&&(state.tier==='all'||x.Tier===state.tier)&&JSON.stringify(x).toLowerCase().includes(q)); $('#crafting').innerHTML=`<div class="hero"><h1>Materiali e Risorse</h1><p class="muted">Cerca in materiali, organici, energie e cibo. Aggiungi quantità all'inventario per usarle con le ricette.</p><div class="toolbar"><input id="craftSearch" class="input" placeholder="Cerca nome, effetto, dettaglio..." value="${esc(state.q)}"><select id="craftType" class="select"><option value="all">Tutti i tipi</option>${['Materiale','Organico','Energia','Cibo'].map(t=>`<option ${state.craftType===t?'selected':''}>${t}</option>`).join('')}</select><select id="tierFilter" class="select"><option value="all">Tutti i tier</option>${tiers.map(t=>`<option ${state.tier===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div><div class="cards">${filtered.slice(0,500).map(itemCard).join('')}</div>${filtered.length>500?'<p class="muted">Mostrati i primi 500 risultati. Restringi la ricerca.</p>':''}`; $('#craftSearch').oninput=e=>{state.q=e.target.value; renderCrafting()}; $('#craftType').onchange=e=>{state.craftType=e.target.value; renderCrafting()}; $('#tierFilter').onchange=e=>{state.tier=e.target.value; renderCrafting()};}
function itemCard(x){let name=itemName(x); return `<div class="item-card"><h3>${esc(name)}</h3><p><span class="pill">${esc(x._type)}</span> ${x.Tier?`<span class="pill">${esc(x.Tier)}</span>`:''} ${val(x,['Is Fuel?','Is fuel?'])==='Yes'?'<span class="pill ok">Fuel</span>':''}</p><div class="kv mini"><div>Costo</div><div>${fmt(money(x))}</div><div>Peso</div><div>${fmt(val(x,['Weight (lbs)']))}</div><div>Effetto</div><div>${fmt(val(x,['Amor Effect','Armor Effect','Weapon Effect','Details & Effects','Details']))}</div></div><div class="toolbar" style="margin-top:10px"><input class="editable" id="qty-${cssSafe(name)}" type="number" min="1" value="1"><button class="btn" onclick="addInv('${escJs(name)}', Number(document.getElementById('qty-${cssSafe(name)}').value||1))">+ Inventario</button></div></div>`}
function cssSafe(s){return String(s||'x').replace(/[^a-z0-9]/gi,'_')}
function escJs(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
window.addInv=(name,qty)=>{state.inventory[name]=(Number(state.inventory[name]||0)+qty); store.set('inventory',state.inventory);}
function renderRecipes(){let q=state.q.toLowerCase(); let recipes=C.recipes.filter(r=>JSON.stringify(r).toLowerCase().includes(q)); $('#recipes').innerHTML=`<div class="hero"><h1>Ricette di Crafting</h1><p class="muted">Scegli una ricetta per vedere ingredienti, strumenti e materiali mancanti rispetto all'inventario.</p><div class="toolbar"><input id="recipeSearch" class="input" placeholder="Cerca ricetta, ingrediente, strumento..." value="${esc(state.q)}"></div></div><div class="recipeBox"><div class="card"><h2>Ricette</h2><div class="cards">${recipes.map(r=>`<button class="item-card" style="text-align:left;cursor:pointer" onclick="selectRecipe('${escJs(r.Result)}')"><h3>${esc(r.Result)}</h3><span class="pill">${esc(r.Tier)}</span><p class="muted mini">${fmt(r['Tools & Stations'])}</p></button>`).join('')}</div></div><div class="card" id="recipeDetail"><h2>Dettaglio</h2>${recipeDetail()}</div></div>`; $('#recipeSearch').oninput=e=>{state.q=e.target.value; renderRecipes()};}
window.selectRecipe=name=>{state.selectedRecipe=name; renderRecipes()}
function recipeDetail(){let r=C.recipes.find(x=>x.Result===state.selectedRecipe)||C.recipes[0]; if(!r)return '<p class="muted">Nessuna ricetta.</p>'; let reqs=recipeReqs(r); return `<h2>${esc(r.Result)}</h2><p><span class="pill">${esc(r.Tier)}</span></p><p><strong>Strumenti:</strong> ${fmt(r['Tools & Stations'])}</p><div class="tablewrap"><table><thead><tr><th>Ingrediente</th><th>Richiesto</th><th>In inventario</th><th>Stato</th></tr></thead><tbody>${reqs.map(x=>{let have=Number(state.inventory[x.name]||0), ok=have>=x.qty; return `<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${have}</td><td><span class="pill ${ok?'ok':'bad'}">${ok?'OK':'Mancano '+(x.qty-have)}</span></td></tr>`}).join('')}</tbody></table></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" onclick="craftRecipe('${escJs(r.Result)}')">Consuma materiali</button></div>`}
window.craftRecipe=name=>{let r=C.recipes.find(x=>x.Result===name), reqs=recipeReqs(r); if(reqs.some(x=>Number(state.inventory[x.name]||0)<x.qty)){alert('Materiali insufficienti.');return} reqs.forEach(x=>state.inventory[x.name]-=x.qty); state.inventory[name]=(Number(state.inventory[name]||0)+1); store.set('inventory',state.inventory); renderRecipes();}
function renderInventory(){let entries=Object.entries(state.inventory).filter(([_,q])=>Number(q)>0).sort((a,b)=>a[0].localeCompare(b[0])); $('#inventory').innerHTML=`<div class="hero"><h1>Inventario Crafting <span class="versiontag">v10 realtime</span></h1><p class="muted">Inventario condiviso online con borsello modificabile. Acquista sottrae il prezzo dalle monete possedute e aggiunge 1 oggetto; Vendi aggiunge il prezzo e rimuove 1 oggetto.</p><div class="toolbar"><button class="btn danger" onclick="clearInv()">Svuota inventario</button></div></div>${walletPanel()}<div class="card" style="margin-top:16px"><h2>Oggetti in inventario</h2><div class="tablewrap"><table><thead><tr><th>Elemento</th><th>Prezzo</th><th>Quantità</th><th>Azioni</th></tr></thead><tbody>${entries.map(([n,q])=>`<tr><td>${esc(n)}</td><td>${priceHtml(n)}</td><td><input class="editable" type="number" min="0" step="1" value="${q}" onchange="setInv('${escJs(n)}',this.value)"></td><td><div class="actionbar"><button class="btn buy" onclick="buyItem('${escJs(n)}')">Acquista</button><button class="btn sell" onclick="sellItem('${escJs(n)}')">Vendi</button><button class="btn" onclick="setInv('${escJs(n)}',0)">Rimuovi</button></div></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Inventario vuoto.</td></tr>'}</tbody></table></div></div>`} 
window.setWallet=(unit,value)=>{state.wallet[unit]=Math.max(0,Number(value||0));saveWallet();renderInventory()}
window.setInv=(n,q)=>{state.inventory[n]=Math.max(0,Number(q||0)); store.set('inventory',state.inventory); renderInventory()}
window.buyItem=(name)=>{let p=itemPrice(name); if(!p){alert('Prezzo non disponibile per questo oggetto.');return} if(Number(state.wallet[p.currency]||0)<p.amount){alert('Monete insufficienti: servono '+p.amount+' '+p.currency+'.');return} state.wallet[p.currency]=Number(state.wallet[p.currency]||0)-p.amount; state.inventory[name]=Number(state.inventory[name]||0)+1; saveWallet(); store.set('inventory',state.inventory); renderInventory()}
window.sellItem=(name)=>{let p=itemPrice(name); if(!p){alert('Prezzo non disponibile per questo oggetto.');return} if(Number(state.inventory[name]||0)<=0){alert('Non possiedi questo oggetto.');return} state.wallet[p.currency]=Number(state.wallet[p.currency]||0)+p.amount; state.inventory[name]=Number(state.inventory[name]||0)-1; saveWallet(); store.set('inventory',state.inventory); renderInventory()}
window.clearInv=()=>{if(confirm('Svuotare inventario?')){state.inventory={};store.set('inventory',{});renderInventory()}}
function renderReference(){ $('#reference').innerHTML=`<div class="hero"><h1>Riferimenti Excel</h1><p class="muted">Tabelle importate dal sistema originale.</p></div><div class="grid"><div class="card"><h2>Panoramica</h2>${gridTable(S.panoramica)}</div><div class="card"><h2>Soglie</h2>${gridTable(S.soglie_grid)}</div><div class="card"><h2>Guida equipaggiamento</h2>${table(C.equipment)}</div><div class="card"><h2>Monete</h2>${table(C.coins)}</div></div>`}
function renderSection(id){({dashboard:renderDashboard,travel:renderTravel,events:renderEvents,crafting:renderCrafting,recipes:renderRecipes,inventory:renderInventory,reference:renderReference}[id]||renderDashboard)()}
function refreshCurrent(){try{renderSection(state.tab||'dashboard')}catch(e){console.error(e)}}
function applyRemoteData(data){applyingRemote=true; try{
  if(data.routeLog!==undefined){state.log=Array.isArray(data.routeLog)?data.routeLog:[]; store.localSet('routeLog',state.log)}
  if(data.inventory!==undefined){state.inventory=data.inventory&&typeof data.inventory==='object'?data.inventory:{}; store.localSet('inventory',state.inventory)}
  if(data.wallet!==undefined){state.wallet=Object.assign({cp:0,sp:0,gp:0,pp:0},data.wallet||{}); store.localSet('wallet',state.wallet)}
  if(data.turns!==undefined){state.turns=Array.isArray(data.turns)?data.turns:null; store.localSet('turns',state.turns)}
  if(data.allocations!==undefined){state.allocations=Array.isArray(data.allocations)?data.allocations:null; store.localSet('allocations',state.allocations)}
} finally {applyingRemote=false} refreshCurrent();}
function initRealtimeSync(){
  if(!window.firebase){setSyncStatus('Firebase non caricato','bad'); return}
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
    remoteRef=db.ref(REMOTE_PATH);
    const connectedRef=db.ref('.info/connected');
    connectedRef.on('value',snap=>setSyncStatus(snap.val()?'Online · sync attiva':'Offline',''+(snap.val()?'ok':'bad')));
    remoteRef.on('value',snap=>{
      const data=snap.val();
      remoteReady=true;
      if(data){applyRemoteData(data);}
      else {initTravelState(); pushRemoteNow();}
    },err=>{console.error(err);setSyncStatus('Permessi Firebase','bad')});
  }catch(e){console.error(e);setSyncStatus('Errore Firebase','bad')}
}
initNav(); renderDashboard(); initRealtimeSync();
</script>
</body>
