/* v39 mobile table + tidy fit fix */
html, body { max-width: 100%; overflow-x: hidden; }
.main, .section, .hero, .card { min-width: 0; max-width: 100%; }
.card { overflow: hidden; }
.tablewrap {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: auto !important;
  overflow-y: hidden;
  display: block;
  position: relative;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x pan-y;
  overscroll-behavior-x: contain;
  scrollbar-width: thin;
}
.tablewrap::-webkit-scrollbar { height: 12px; }
.tablewrap::-webkit-scrollbar-thumb { background: rgba(200,150,62,.55); border-radius: 999px; }
.tablewrap::-webkit-scrollbar-track { background: rgba(255,255,255,.06); border-radius: 999px; }
.tablewrap table { width: max-content; max-width: none; table-layout: auto; }
#travel .tablewrap table:not(.allocation-table) { min-width: 920px; }
#travel .allocation-table { min-width: 1120px; }
#travel .tablewrap::before {
  content: "↔ scorri";
  position: sticky;
  left: 8px;
  top: 6px;
  z-index: 5;
  display: inline-flex;
  pointer-events: none;
  margin: 6px 0 -28px 8px;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid rgba(200,150,62,.35);
  background: rgba(12,17,25,.86);
  color: var(--muted);
  font-size: .74rem;
  backdrop-filter: blur(6px);
}
#travel .tablewrap.is-at-end::before { opacity: .35; }
#travel th, #travel td { white-space: nowrap; }
#travel .confirm-cell { white-space: normal; }
#travel .toolbar { align-items: end; }
#travel .toolbar label { display: grid; gap: 4px; }
#travel .toolbar .editable { width: 90px; }

  #travel .tablewrap { max-width: calc(100vw - 28px); margin-left: 0; margin-right: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 14px; }
  #travel .tablewrap table:not(.allocation-table) { min-width: 840px; }
  #travel .allocation-table { min-width: 1040px; }
  #travel th, #travel td { padding: 8px 9px; font-size: .88rem; }
  #travel .editable { width: 54px; padding: 6px; }
  #travel .select { min-width: 118px; padding: 8px 9px; }
  #travel .calc-cell { min-width: 38px; padding: 6px 7px; }
  #travel .toolbar { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  #travel .toolbar .pill, #travel .toolbar .btn { width: 100%; justify-content: center; text-align: center; }

function table(rows, cols=null){ if(!rows?.length)return '<p class="muted">Nessun dato.</p>'; cols=cols||Object.keys(rows[0]); return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${fmt(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

function allItems(){return [...C.materials.map(x=>({...x,_type:'Materiale'})),...C.organics.map(x=>({...x,_type:'Organico'})),...C.energy.map(x=>({...x,_type:'Energia'})),...C.food.map(x=>({...x,_type:'Cibo'}))]}
function recipeReqs(r){const pairs=[['Material','Qty'],['Material 2','Qty 2'],['Organic','Qty 3'],['Organic 2','Qty 4'],['Energy','Qty 5'],['Energy 2','Qty 6']]; return pairs.map(([n,q])=>({name:r[n],qty:Number(r[q]||0)})).filter(x=>x.name&&x.name!='-'&&x.qty>0)}
function setTab(id){state.tab=id; $$('.section').forEach(x=>x.classList.toggle('active',x.id===id)); $$('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.tab===id)); try{renderSection(id)}catch(e){console.error(e); const el=document.getElementById(id); if(el)el.innerHTML="<div class=\"notice\">Errore nel caricamento della sezione. Apri la console e inviami l\'errore.</div>";}}

function renderDashboard(){ $('#dashboard').innerHTML=`<div class="hero"><h1>Console della Nave</h1><p class="muted">Una web app sincronizzata online per gestire il sistema di viaggio Spelljammer, eventi, crafting, ricette e inventario della campagna.</p><div class="toolbar"><button class="btn primary" onclick="setTab('events')">Tira evento di rotta</button><button class="btn" onclick="setTab('recipes')">Consulta ricette</button><button class="btn" onclick="setTab('travel')">Gestisci turni</button><button class="btn" onclick="setTab('crew')">Equipaggio</button><button class="btn" onclick="setTab('fleet')">Flotta</button><button class="btn" onclick="exportSave()">Esporta backup</button><button class="btn" onclick="document.getElementById('importSaveInput').click()">Importa backup</button><input id="importSaveInput" type="file" accept="application/json" style="display:none" onchange="importSave(this.files[0]); this.value=''"></div></div>${statCards()}<div class="grid cols2" style="margin-top:16px"><div class="card"><h2>Ultimi eventi</h2><div class="log">${state.log.slice(0,6).map(logHtml).join('')||'<p class="muted">Nessun evento registrato.</p>'}</div></div><div class="card"><h2>Attività di viaggio</h2><div class="cards">${S.attivita.slice(0,4).map(a=>`<div class="item-card"><h3>${esc(a.Attività)}</h3><p class="muted mini">${esc(a['Cosa Produce'])}</p><span class="pill">${esc(a.Costo)}</span></div>`).join('')}</div></div></div>`}
const ROUTE_REQ={"Calma":{man:1,morale:1},"Tier I":{man:2,morale:2},"Tier II":{man:4,morale:3},"Tier III":{man:6,morale:4}};
const ZONE_REQ={"Tranquilla":{sic:1,morale:1},"Trafficata":{sic:2,morale:2},"Pericolosa":{sic:3,morale:3},"Ostile":{sic:4,morale:4}};
const ACTIVITY_COLS=['Addestramento','Ricerca','Manutenzione','Socializzare','Recupero','Crafting','Sicurezza','Morale'];
const SHIP_CONFIRM_COLS=['Manutenzione','Sicurezza','Morale','Socializzare'];
const STOCK_CONFIRM_COLS=['Ricerca','Addestramento'];
const DEFAULT_POINTS_PER_TURN=3;
function defaultTravelSettings(){return {turnCount:12,pointsPerTurn:DEFAULT_POINTS_PER_TURN}}
function travelSettings(){state.travelSettings=Object.assign(defaultTravelSettings(),state.travelSettings||{}); state.travelSettings.turnCount=Math.max(1,Math.min(12,n(state.travelSettings.turnCount)||12)); state.travelSettings.pointsPerTurn=Math.max(1,Math.min(20,n(state.travelSettings.pointsPerTurn)||DEFAULT_POINTS_PER_TURN)); return state.travelSettings}
function pointsPerTurn(){return travelSettings().pointsPerTurn}
function turnCount(){return travelSettings().turnCount}
function n(v){let x=Number(v); return Number.isFinite(x)?x:0}
function confirmedKey(k){return 'Confermato '+k}
function bankedKey(k){return 'Bancato '+k}
function rowTotal(row){return ACTIVITY_COLS.reduce((t,k)=>t+n(row[k]),0)}
function rowAvailable(row){return pointsPerTurn()-rowTotal(row)}
function projectTypeLabel(t){return t==='training'?'Addestramento':'Ricerca'}
function projectPoolKey(t){return t==='training'?'trainingEarned':'researchEarned'}
function crewProjects(c,type=null){let list=Array.isArray(c?.projects)?c.projects:[]; return type?list.filter(p=>p.type===type):list}
function crewSpent(c,type){return crewProjects(c,type).reduce((t,p)=>t+n(p.progress),0)}
function crewEarned(c,type){return n(c?.[projectPoolKey(type)])}
function crewReserve(c,type){return Math.max(0, crewEarned(c,type)-crewSpent(c,type))}
function crewCarryKey(type){return type==='training'?'trainingCarry':'researchCarry'}
function recomputeCrewPoolsFromAllocations(){
  const totals=new Map();
  (state.allocations||[]).forEach(r=>{
    if(!r||!r.CrewId)return;
    const id=String(r.CrewId);
    const t=totals.get(id)||{research:0,training:0};
    t.research+=n(r[bankedKey('Ricerca')]);
    t.training+=n(r[bankedKey('Addestramento')]);
    totals.set(id,t);
  });
  (state.crew||[]).forEach(c=>{
    const t=totals.get(String(c.id))||{research:0,training:0};
    const spentResearch=crewSpent(c,'research');
    const spentTraining=crewSpent(c,'training');
    c.researchCarry=n(c.researchCarry);
    c.trainingCarry=n(c.trainingCarry);
    c.researchEarned=Math.max(c.researchCarry+t.research, spentResearch);
    c.trainingEarned=Math.max(c.trainingCarry+t.training, spentTraining);
  });
}
function carryConfirmedStockBeforeTravelReset(){
  recomputeCrewPoolsFromAllocations();
  (state.crew||[]).forEach(c=>{
    c.researchCarry=Math.max(n(c.researchCarry), crewEarned(c,'research'));
    c.trainingCarry=Math.max(n(c.trainingCarry), crewEarned(c,'training'));
  });
}

function crewAllocationName(c){return (c?.name||c?.player||'Nuova scheda PG').trim()||'Nuova scheda PG'}
function allocationBlank(turn,c){let row={Turno:turn,CrewId:c.id,PG:crewAllocationName(c),ConfirmedAt:''}; ACTIVITY_COLS.forEach(k=>row[k]=0); SHIP_CONFIRM_COLS.forEach(k=>row[confirmedKey(k)]=0); STOCK_CONFIRM_COLS.forEach(k=>row[bankedKey(k)]=0); return row}
function normalizeAllocationRow(row,turn,c){let base=allocationBlank(turn,c); if(row){ACTIVITY_COLS.forEach(k=>base[k]=n(row[k])); SHIP_CONFIRM_COLS.forEach(k=>base[confirmedKey(k)]=n(row[confirmedKey(k)])); STOCK_CONFIRM_COLS.forEach(k=>base[bankedKey(k)]=n(row[bankedKey(k)])); base.ConfirmedAt=row.ConfirmedAt||''} return base}
function allocationRowKey(turn,crewId){return String(turn)+'::'+String(crewId||'')}
function allocationKeyFromRow(row){return allocationRowKey(row?.Turno,row?.CrewId)}
function allocationIndexByKey(key){return (state.allocations||[]).findIndex(r=>allocationKeyFromRow(r)===key)}
function allocationRowByKey(key){let i=allocationIndexByKey(key); return i>=0?state.allocations[i]:null}
function stableCrewList(){return (Array.isArray(state.crew)?state.crew:[]).filter(c=>c&&c.id).map(normalizeCrew)}
function syncAllocationsWithCrew(persist=false){
  if(!Array.isArray(state.turns))return false;
  travelSettings();
  const crew=stableCrewList();
  const old=Array.isArray(state.allocations)?state.allocations:[];
  const byId=new Map(), byName=new Map();
  old.forEach(r=>{
    if(!r)return;
    const turn=Number(r.Turno)||r.Turno;
    if(r.CrewId)byId.set(allocationRowKey(turn,r.CrewId),r);
    if(r.PG)byName.set(String(turn)+'::'+String(r.PG).trim().toLowerCase(),r);
  });
  const next=[];
  state.turns.forEach(t=>{
    const turn=Number(t.Turno)||t.Turno;
    crew.forEach(c=>{
      const name=crewAllocationName(c);
      const prev=byId.get(allocationRowKey(turn,c.id)) || byName.get(String(turn)+'::'+String(name).trim().toLowerCase());
      const row=normalizeAllocationRow(prev,turn,c);
      row.CrewId=c.id;
      row.PG=name;
      row.RowKey=allocationRowKey(turn,c.id);
      next.push(row);
    });
  });
  const compact=row=>({RowKey:allocationKeyFromRow(row),Turno:Number(row.Turno)||row.Turno,CrewId:row.CrewId||'',PG:row.PG||'',ConfirmedAt:row.ConfirmedAt||'',...Object.fromEntries(ACTIVITY_COLS.map(k=>[k,n(row[k])])),...Object.fromEntries(SHIP_CONFIRM_COLS.map(k=>[confirmedKey(k),n(row[confirmedKey(k)])])),...Object.fromEntries(STOCK_CONFIRM_COLS.map(k=>[bankedKey(k),n(row[bankedKey(k)])]))});
  const changed=JSON.stringify(old.map(compact))!==JSON.stringify(next.map(compact));
  state.allocations=next;
  localSet('allocations',state.allocations);
  if(changed&&persist&&!applyingRemote)scheduleRemotePush();
  return changed;
}
function allocationTableHtml(){
  syncAllocationsWithCrew(false);
  const crew=stableCrewList();
  if(!crew.length)return '<div class="notice">Nessun PG in Equipaggio. Crea almeno una scheda nella sezione <strong>Equipaggio</strong>: comparirà automaticamente qui in tutti i turni.</div>';
  return `<div class="notice" style="margin-bottom:12px">Righe generate: <strong>${state.allocations.length}</strong> = <strong>${turnCount()}</strong> turni × <strong>${crew.length}</strong> PG. Ogni riga segue automaticamente aggiunte, rimozioni e rinomini dell\'Equipaggio.</div><div class="tablewrap"><table class="allocation-table"><thead><tr>${['Turno','PG','Punti','Addestramento','Ricerca','Manutenzione','Socializzare','Recupero','Crafting','Sicurezza','Morale','Totale','Conferma allocazione'].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody id="allocationBody">${state.allocations.map(allocationRow).join('')}</tbody></table></div>`;
}
function initTravelState(){
  const settings=travelSettings();
  let existing=Array.isArray(state.turns)?state.turns:[];
  state.turns=Array.from({length:settings.turnCount},(_,i)=>{let x=existing.find(t=>Number(t.Turno)===i+1)||existing[i]||S.tracker[i]||{}; return {Turno:i+1,'Condizione Rotta':ROUTE_REQ[x['Condizione Rotta']]?x['Condizione Rotta']:'Calma',Zona:ZONE_REQ[x.Zona]?x.Zona:'Tranquilla','Durata Narrativa':x['Durata Narrativa']||''}});
  store.set('turns',state.turns);
  if(!Array.isArray(state.allocations))state.allocations=[];
  state.allocations=state.allocations.map(x=>{let y={...x}; ACTIVITY_COLS.forEach(k=>y[k]=n(y[k])); SHIP_CONFIRM_COLS.forEach(k=>y[confirmedKey(k)]=n(y[confirmedKey(k)])); STOCK_CONFIRM_COLS.forEach(k=>y[bankedKey(k)]=n(y[bankedKey(k)])); y.ConfirmedAt=y.ConfirmedAt||''; return y});
  syncAllocationsWithCrew(false); recomputeCrewPoolsFromAllocations();
}
function calcTurn(r){
  let condition=ROUTE_REQ[r['Condizione Rotta']]?r['Condizione Rotta']:'Calma', zone=ZONE_REQ[r.Zona]?r.Zona:'Tranquilla';
  syncAllocationsWithCrew(false);
  let rows=(state.allocations||[]).filter(a=>String(a.Turno)===String(r.Turno));
  let manO=rows.reduce((t,a)=>t+n(a[confirmedKey('Manutenzione')]),0);
  let sicO=rows.reduce((t,a)=>t+n(a[confirmedKey('Sicurezza')]),0);
  let morO=rows.reduce((t,a)=>t+n(a[confirmedKey('Socializzare')])+n(a[confirmedKey('Morale')]),0);
  let manR=ROUTE_REQ[condition].man, sicR=ZONE_REQ[zone].sic, morR=ROUTE_REQ[condition].morale+ZONE_REQ[zone].morale;
  let mod=(morO<morR?-2:0)+(manO<manR?-3:0)+(sicO<sicR?-4:0)+Math.floor((Math.max(0,manO-manR)+Math.max(0,sicO-sicR)+Math.max(0,morO-morR))/2);
  let ok=[manO>=manR,sicO>=sicR,morO>=morR].filter(Boolean).length;
  return {...r,'Condizione Rotta':condition,Zona:zone,'Manut. Rich.':manR,'Manut. Ottenuta':manO,'Sic. Rich.':sicR,'Sic. Ottenuta':sicO,'Morale Rich.':morR,'Morale Ottenuto':morO,'Mod Evento':mod,_ok:ok};
}
function renderTravel(){ initTravelState(); const settings=travelSettings(); const crew=stableCrewList(); const cols=['Turno','Condizione Rotta','Zona','Manut. Rich.','Manut. Ottenuta','Sic. Rich.','Sic. Ottenuta','Morale Rich.','Morale Ottenuto','Mod Evento']; $('#travel').innerHTML=`<div class="hero"><h1>Viaggio Spelljammer <span class="versiontag">v40 scroll stabile</span></h1><p class="muted">Ogni PG ha <strong>${settings.pointsPerTurn} punti per turno</strong>. L\'allocazione viene generata sempre come <strong>numero turni × PG in Equipaggio</strong> e ogni riga è agganciata al personaggio corretto.</p><div class="toolbar"><label class="muted mini">Numero turni <input class="editable" type="number" min="1" max="12" step="1" value="${settings.turnCount}" onchange="updateTravelSetting('turnCount',this.value)"></label><label class="muted mini">Punti per PG/turno <input class="editable" type="number" min="1" max="20" step="1" value="${settings.pointsPerTurn}" onchange="updateTravelSetting('pointsPerTurn',this.value)"></label><span class="pill">${crew.length} PG · ${crew.length*settings.pointsPerTurn} punti totali per turno</span><span class="pill">${state.allocations.length} righe allocazione</span><button class="btn primary" onclick="saveTravel()">Salva ora</button><button class="btn danger" onclick="resetTravel()">Reset viaggio</button></div></div><div class="card"><h2>Tracker turni</h2><div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Esito</th></tr></thead><tbody id="trackerBody">${state.turns.map((r,i)=>turnRow(r,i)).join('')}</tbody></table></div><p class="muted mini">Formula Mod Evento: -2 se Morale insufficiente, -3 se Manutenzione insufficiente, -4 se Sicurezza insufficiente, +1 ogni 2 punti di surplus complessivo. I valori ottenuti usano solo allocazioni confermate.</p></div><div class="card" style="margin-top:16px"><h2>Allocazione PG</h2><p class="muted">Se aggiungi, rimuovi o rinomini PG in Equipaggio, questa tabella si riallinea automaticamente. La tabella mantiene i punti allineati al PG corretto anche quando cambia l’equipaggio. Le bozze non vengono inviate online finché non premi Conferma.</p>${allocationTableHtml()}</div>`}
function selectHtml(value, options, attrs){return `<select class="select" ${attrs}>${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
function turnRow(r,i){let c=calcTurn(r), cls=c._ok===3?'ok':c._ok>=1?'warn':'bad'; return `<tr data-i="${i}"><td>${esc(c.Turno)}</td><td>${selectHtml(c['Condizione Rotta'],Object.keys(ROUTE_REQ),`onchange="updateTurnField(${i},'Condizione Rotta',this.value)"`)}</td><td>${selectHtml(c.Zona,Object.keys(ZONE_REQ),`onchange="updateTurnField(${i},'Zona',this.value)"`)}</td>${['Manut. Rich.','Manut. Ottenuta','Sic. Rich.','Sic. Ottenuta','Morale Rich.','Morale Ottenuto','Mod Evento'].map(k=>`<td class="locked"><span class="calc-cell ${k.includes('Rich')?'warn':''}">${esc(c[k])}</span></td>`).join('')}<td><span class="pill ${cls}">${c._ok}/3 soglie</span></td></tr>`}
function allocationRow(r){let key=allocationKeyFromRow(r), safeKey=cssSafe(key), limit=pointsPerTurn(), total=rowTotal(r), avail=rowAvailable(r), confirmed=SHIP_CONFIRM_COLS.reduce((t,k)=>t+n(r[confirmedKey(k)]),0)+STOCK_CONFIRM_COLS.reduce((t,k)=>t+n(r[bankedKey(k)]),0); let status=r.ConfirmedAt?`<span class="pill ok">Confermata</span><span class="muted mini">${esc(r.ConfirmedAt)}</span>`:'<span class="pill warn">Bozza</span>'; return `<tr data-ak="${esc(key)}"><td>${esc(r.Turno)}</td><td class="alloc-player"><strong>${esc(r.PG)}</strong></td><td class="points-cell"><span class="points-inline"><strong id="alloc-avail-${safeKey}">${avail}</strong><span class="muted mini">su ${limit}</span></span></td>${ACTIVITY_COLS.map(k=>`<td><input class="editable" type="number" min="0" step="1" value="${n(r[k])}" oninput="updateAllocationDraftByKey('${escJs(key)}','${k}',this.value)"></td>`).join('')}<td><span class="pill ${total>limit?'bad':total===limit?'ok':'warn'}" id="alloc-total-${safeKey}">${total}/${limit}</span></td><td class="confirm-cell"><div class="actionbar"><button class="btn primary" onclick="confirmAllocationByKey('${escJs(key)}')">Conferma</button></div><div id="alloc-status-${safeKey}" class="mini" style="margin-top:6px">${status}</div><div class="muted mini" style="margin-top:4px">Confermato: ${confirmed} pt</div></td></tr>`}
function refreshAllocationRowIndicatorsByKey(key){let row=allocationRowByKey(key); if(!row)return; let safeKey=cssSafe(key), limit=pointsPerTurn(), total=rowTotal(row), avail=rowAvailable(row), av=document.getElementById(`alloc-avail-${safeKey}`), el=document.getElementById(`alloc-total-${safeKey}`); if(av)av.textContent=avail; if(el){el.textContent=`${total}/${limit}`; el.className=`pill ${total>limit?'bad':total===limit?'ok':'warn'}`}}
window.updateTravelSetting=(key,value)=>{travelSettings(); if(key==='turnCount')state.travelSettings.turnCount=Math.max(1,Math.min(12,n(value)||12)); if(key==='pointsPerTurn')state.travelSettings.pointsPerTurn=Math.max(1,Math.min(20,n(value)||DEFAULT_POINTS_PER_TURN)); localSet('travelSettings',state.travelSettings); initTravelState(); saveTravel(false); scheduleRemotePush(); renderTravel()}
window.updateTurnField=(i,k,v)=>{state.turns[i][k]=v; localSet('turns',state.turns); saveTravel(false); $('#trackerBody').innerHTML=state.turns.map((r,i)=>turnRow(r,i)).join('')}
window.updateAllocationDraftByKey=(key,k,v)=>{syncAllocationsWithCrew(false); let row=allocationRowByKey(key); if(!row)return; row[k]=n(v); row.ConfirmedAt=''; localSet('allocations',state.allocations); refreshAllocationRowIndicatorsByKey(key); let st=document.getElementById(`alloc-status-${cssSafe(key)}`); if(st)st.innerHTML='<span class="pill warn">Bozza non confermata</span><span class="muted mini"> · premi Conferma per salvare online</span>'; }
window.updateAllocationDraft=(i,k,v)=>{let row=(state.allocations||[])[i]; if(row)window.updateAllocationDraftByKey(allocationKeyFromRow(row),k,v)}
window.confirmAllocationByKey=(key)=>{syncAllocationsWithCrew(false); recomputeCrewPoolsFromAllocations(); let row=allocationRowByKey(key); if(!row)return; let total=rowTotal(row); let limit=pointsPerTurn(); if(total>limit){alert(`Hai speso ${total} punti. Ogni PG ha solo ${limit} punti per turno.`);return} let c=crewById(row.CrewId); if(!c){alert('PG non trovato in Equipaggio.');return} let deltaRic=n(row.Ricerca)-n(row[bankedKey('Ricerca')]); let deltaAdd=n(row.Addestramento)-n(row[bankedKey('Addestramento')]); if(crewReserve(c,'research')+deltaRic<0){alert('Non puoi ridurre la Ricerca confermata: alcuni punti sono già stati assegnati ai progetti.');return} if(crewReserve(c,'training')+deltaAdd<0){alert('Non puoi ridurre l’Addestramento confermato: alcuni punti sono già stati assegnati ai progetti.');return} row[bankedKey('Ricerca')]=n(row.Ricerca); row[bankedKey('Addestramento')]=n(row.Addestramento); SHIP_CONFIRM_COLS.forEach(k=>row[confirmedKey(k)]=n(row[k])); row.ConfirmedAt=new Date().toLocaleString('it-IT'); recomputeCrewPoolsFromAllocations(); localSet('crew',state.crew||[]); localSet('allocations',state.allocations); saveTravel(false); scheduleRemotePush(); renderTravel()}
window.confirmAllocation=(i)=>{let row=(state.allocations||[])[i]; if(row)window.confirmAllocationByKey(allocationKeyFromRow(row))}
window.updateAllocationNote=(i,v)=>{}
window.saveTravel=(notify=true)=>{
  syncAllocationsWithCrew(false);
  localSet('travelSettings',state.travelSettings||defaultTravelSettings());
  localSet('turns',state.turns);
  localSet('allocations',state.allocations);
  localSet('crew',state.crew||[]);
  if(remoteRef&&remoteReady&&!applyingRemote){
    remoteRef.update({travelSettings:state.travelSettings||defaultTravelSettings(),turns:state.turns||null,allocations:state.allocations||null,crew:state.crew||[],fleet:state.fleet||[],updatedAt:new Date().toISOString()})
      .catch(e=>{console.error(e);setSyncStatus('Errore salvataggio viaggio','bad')});
  }
  if(notify)alert('Viaggio salvato online.');
}
window.resetTravel=()=>{ if(confirm("Ripristinare tracker e rigenerare l'allocazione PG dall'equipaggio? Le scorte Ricerca/Addestramento già ottenute verranno conservate.")){carryConfirmedStockBeforeTravelReset(); state.turns=null; state.allocations=null; localSet('crew',state.crew||[]); store.remove('turns'); store.remove('allocations'); initTravelState(); recomputeCrewPoolsFromAllocations(); localSet('crew',state.crew||[]); pushRemoteNow(); renderTravel()}}
function eventRows(){return S.eventi.filter(e=>['Complicazione grave','Complicazione minore','Nessun evento importante','Opportunità','Scoperta rara'].includes(e['Tipo Evento']))}
function selectedEventTurn(){let v=Number($('#eventTurn')?.value||1); return Math.min(12,Math.max(1,v))}
function eventModForTurn(turn){initTravelState(); let row=state.turns.find(r=>Number(r.Turno)===Number(turn))||state.turns[turn-1]||state.turns[0]; return calcTurn(row)['Mod Evento']||0}
window.updateEventTurnPreview=()=>{let turn=selectedEventTurn(), mod=eventModForTurn(turn), box=$('#eventModPreview'); if(box)box.innerHTML=`Mod Evento turno ${turn}: <strong>${mod>=0?'+':''}${mod}</strong>`}
function renderEvents(){ initTravelState(); let cleanEvents=eventRows(); $('#events').innerHTML=`<div class="hero"><h1>Generatore Eventi di Rotta <span class="versiontag">v10 realtime</span></h1><p class="muted">Scegli il turno dell'evento: il tiro userà automaticamente il <strong>Mod Evento</strong> calcolato nella sezione Viaggio per quel turno.</p><div class="toolbar"><label class="muted mini" for="eventTurn">Turno evento</label><select id="eventTurn" class="select" onchange="updateEventTurnPreview()">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select><span id="eventModPreview" class="pill"></span></div><div class="toolbar"><button class="btn primary" onclick="rollEvent()">Tira d20</button><button class="btn" onclick="clearLog()">Svuota diario</button></div><div id="rollResult"></div></div><div class="grid cols2"><div class="card"><h2>Tabella eventi</h2>${table(cleanEvents,['Tiro d20 modificato','Tipo Evento','Descrizione','Intensità'])}</div><div class="card"><h2>Diario eventi</h2><div class="log" id="eventLog">${state.log.map(logHtml).join('')||'<p class="muted">Nessun evento.</p>'}</div></div></div>`; updateEventTurnPreview();}
function parseRange(s){let m=String(s).match(/(-?\d+)\s*[–-]\s*(-?\d+)/); if(m)return [+m[1],+m[2]]; m=String(s).match(/(-?\d+)/); if(m)return [+m[1],+m[1]]; return [-999,999]}
function eventFor(total){let rows=eventRows(); return rows.find(e=>{let [a,b]=parseRange(e['Tiro d20 modificato']); return total>=a&&total<=b})||rows[rows.length-1]}
window.rollEvent=()=>{let turn=selectedEventTurn(), d=1+Math.floor(Math.random()*20), mod=eventModForTurn(turn), total=d+mod, e=eventFor(total); let entry={time:new Date().toLocaleString('it-IT'), turn, d, mod, total, type:e['Tipo Evento'], desc:e.Descrizione, intensity:e['Intensità']}; state.log.unshift(entry); store.set('routeLog',state.log); $('#rollResult').innerHTML=`<div class="card"><div class="muted">Risultato turno ${turn}</div><div class="dice">${d} ${mod>=0?'+':''}${mod} = ${total}</div><h2>${esc(entry.type)}</h2><p>${esc(entry.desc)}</p><span class="pill ${entry.type?.includes('grave')?'bad':entry.type?.includes('minore')?'warn':'ok'}">${esc(entry.intensity)}</span></div>`; $('#eventLog').innerHTML=state.log.map(logHtml).join(''); updateEventTurnPreview();}
function logHtml(x){return `<div class="logitem"><strong>${esc(x.type)}</strong> <span class="pill">${esc(x.total??'')}</span><br><span class="muted mini">${esc(x.time)}${x.turn?` · turno ${esc(x.turn)}`:''} · d20 ${esc(x.d)} ${x.mod>=0?'+':''}${esc(x.mod)}</span><p>${esc(x.desc)}</p></div>`}
window.clearLog=()=>{ if(confirm('Svuotare il diario eventi?')){state.log=[]; store.set('routeLog',state.log); renderEvents();}}
function renderCrafting(){let items=allItems(); let tiers=[...new Set(items.map(x=>x.Tier).filter(Boolean))]; let q=state.q.toLowerCase(); let filtered=items.filter(x=>(state.craftType==='all'||x._type===state.craftType)&&(state.tier==='all'||x.Tier===state.tier)&&JSON.stringify(x).toLowerCase().includes(q)); $('#crafting').innerHTML=`<div class="hero"><h1>Materiali e Risorse</h1><p class="muted">Cerca in materiali, organici, energie e cibo. Aggiungi quantità all'inventario per usarle con le ricette.</p><div class="toolbar"><input id="craftSearch" class="input" placeholder="Cerca nome, effetto, dettaglio..." value="${esc(state.q)}"><select id="craftType" class="select"><option value="all">Tutti i tipi</option>${['Materiale','Organico','Energia','Cibo'].map(t=>`<option ${state.craftType===t?'selected':''}>${t}</option>`).join('')}</select><select id="tierFilter" class="select"><option value="all">Tutti i tier</option>${tiers.map(t=>`<option ${state.tier===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div><div class="cards">${filtered.slice(0,500).map(itemCard).join('')}</div>${filtered.length>500?'<p class="muted">Mostrati i primi 500 risultati. Restringi la ricerca.</p>':''}`; $('#craftSearch').oninput=e=>{state.q=e.target.value; renderCrafting()}; $('#craftType').onchange=e=>{state.craftType=e.target.value; renderCrafting()}; $('#tierFilter').onchange=e=>{state.tier=e.target.value; renderCrafting()};}
function itemCard(x){let name=itemName(x); return `<div class="item-card"><h3>${esc(name)}</h3><p><span class="pill">${esc(x._type)}</span> ${x.Tier?`<span class="pill">${esc(x.Tier)}</span>`:''} ${val(x,['Is Fuel?','Is fuel?'])==='Yes'?'<span class="pill ok">Fuel</span>':''}</p><div class="kv mini"><div>Costo</div><div>${fmt(money(x))}</div><div>Peso</div><div>${fmt(val(x,['Weight (lbs)']))}</div><div>Effetto</div><div>${fmt(val(x,['Amor Effect','Armor Effect','Weapon Effect','Details & Effects','Details']))}</div></div><div class="toolbar" style="margin-top:10px"><input class="editable" id="qty-${cssSafe(name)}" type="number" min="1" value="1"><button class="btn" onclick="addInv('${escJs(name)}', Number(document.getElementById('qty-${cssSafe(name)}').value||1))">+ Inventario</button></div></div>`}
function cssSafe(s){return String(s||'x').replace(/[^a-z0-9]/gi,'_')}
function escJs(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
window.addInv=(name,qty)=>{state.inventory[name]=(Number(state.inventory[name]||0)+qty); store.set('inventory',state.inventory);}
function renderRecipes(){let q=state.q.toLowerCase(); let recipes=C.recipes.filter(r=>JSON.stringify(r).toLowerCase().includes(q)); $('#recipes').innerHTML=`<div class="hero"><h1>Ricette di Crafting</h1><p class="muted">Scegli una ricetta per vedere ingredienti, strumenti e materiali mancanti rispetto all'inventario.</p><div class="toolbar"><input id="recipeSearch" class="input" placeholder="Cerca ricetta, ingrediente, strumento..." value="${esc(state.q)}"></div></div><div class="recipeBox"><div class="card"><h2>Ricette</h2><div class="cards">${recipes.map(r=>`<button class="item-card" style="text-align:left;cursor:pointer" onclick="selectRecipe('${escJs(r.Result)}')"><h3>${esc(r.Result)}</h3><span class="pill">${esc(r.Tier)}</span><p class="muted mini">${fmt(r['Tools & Stations'])}</p></button>`).join('')}</div></div><div class="card" id="recipeDetail"><h2>Dettaglio</h2>${recipeDetail()}</div></div>`; $('#recipeSearch').oninput=e=>{state.q=e.target.value; renderRecipes()};}
window.selectRecipe=name=>{state.selectedRecipe=name; renderRecipes()}
function recipeDetail(){let r=C.recipes.find(x=>x.Result===state.selectedRecipe)||C.recipes[0]; if(!r)return '<p class="muted">Nessuna ricetta.</p>'; let reqs=recipeReqs(r); return `<h2>${esc(r.Result)}</h2><p><span class="pill">${esc(r.Tier)}</span></p><p><strong>Strumenti:</strong> ${fmt(r['Tools & Stations'])}</p><div class="tablewrap"><table><thead><tr><th>Ingrediente</th><th>Richiesto</th><th>In inventario</th><th>Stato</th></tr></thead><tbody>${reqs.map(x=>{let have=Number(state.inventory[x.name]||0), ok=have>=x.qty; return `<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${have}</td><td><span class="pill ${ok?'ok':'bad'}">${ok?'OK':'Mancano '+(x.qty-have)}</span></td></tr>`}).join('')}</tbody></table></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" onclick="craftRecipe('${escJs(r.Result)}')">Consuma materiali</button></div>`}
window.craftRecipe=name=>{let r=C.recipes.find(x=>x.Result===name), reqs=recipeReqs(r); if(reqs.some(x=>Number(state.inventory[x.name]||0)<x.qty)){alert('Materiali insufficienti.');return} reqs.forEach(x=>state.inventory[x.name]-=x.qty); state.inventory[name]=(Number(state.inventory[name]||0)+1); store.set('inventory',state.inventory); renderRecipes();}
function renderInventory(){let entries=Object.entries(state.inventory).filter(([_,q])=>Number(q)>0).sort((a,b)=>a[0].localeCompare(b[0])); $('#inventory').innerHTML=`<div class="hero"><h1>Inventario Crafting <span class="versiontag">v10 realtime</span></h1><p class="muted">Inventario condiviso online con borsello modificabile. Acquista sottrae il prezzo dalle monete possedute e aggiunge 1 oggetto; Vendi aggiunge il prezzo e rimuove 1 oggetto.</p><div class="toolbar"><button class="btn danger" onclick="clearInv()">Svuota inventario</button></div></div>${walletPanel()}<div class="card" style="margin-top:16px"><h2>Oggetti in inventario</h2><div class="tablewrap"><table><thead><tr><th>Elemento</th><th>Prezzo</th><th>Quantità</th><th>Azioni</th></tr></thead><tbody>${entries.map(([n,q])=>`<tr><td>${esc(n)}</td><td>${priceHtml(n)}</td><td><input class="editable" type="number" min="0" step="1" value="${q}" onchange="setInv('${escJs(n)}',this.value)"></td><td><div class="actionbar"><button class="btn buy" onclick="buyItem('${escJs(n)}')">Acquista</button><button class="btn sell" onclick="sellItem('${escJs(n)}')">Vendi</button><button class="btn" onclick="setInv('${escJs(n)}',0)">Rimuovi</button></div></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Inventario vuoto.</td></tr>'}</tbody></table></div></div>`} 
window.setWallet=(unit,value)=>{state.wallet[unit]=Math.max(0,Number(value||0));saveWallet();renderInventory()}
window.setInv=(n,q)=>{state.inventory[n]=Math.max(0,Number(q||0)); store.set('inventory',state.inventory); renderInventory()}
window.buyItem=(name)=>{let p=itemPrice(name); if(!p){alert('Prezzo non disponibile per questo oggetto.');return} if(Number(state.wallet[p.currency]||0)<p.amount){alert('Monete insufficienti: servono '+p.amount+' '+p.currency+'.');return} state.wallet[p.currency]=Number(state.wallet[p.currency]||0)-p.amount; state.inventory[name]=Number(state.inventory[name]||0)+1; saveWallet(); store.set('inventory',state.inventory); renderInventory()}
window.sellItem=(name)=>{let p=itemPrice(name); if(!p){alert('Prezzo non disponibile per questo oggetto.');return} if(Number(state.inventory[name]||0)<=0){alert('Non possiedi questo oggetto.');return} state.wallet[p.currency]=Number(state.wallet[p.currency]||0)+p.amount; state.inventory[name]=Number(state.inventory[name]||0)-1; saveWallet(); store.set('inventory',state.inventory); renderInventory()}
window.clearInv=()=>{if(confirm('Svuotare inventario?')){state.inventory={};store.set('inventory',{});renderInventory()}}

function blankCrew(){return {id:'pg_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),image:'',name:'',player:'',race:'',classLevel:'',hpCurrent:'',hpMax:'',ac:'',speed:'',str:'',dex:'',con:'',int:'',wis:'',cha:'',dndbeyond:'',role:'',notes:'',researchEarned:0,trainingEarned:0,researchCarry:0,trainingCarry:0,projects:[]}}
function normalizeCrew(c){c=c||{}; if(!c.id)c.id='pg_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7); c.researchEarned=n(c.researchEarned); c.trainingEarned=n(c.trainingEarned); c.researchCarry=n(c.researchCarry); c.trainingCarry=n(c.trainingCarry); c.projects=Array.isArray(c.projects)?c.projects:[]; c.projects.forEach(p=>{p.type=p.type==='training'?'training':'research'; p.progress=n(p.progress)}); return c}
function saveCrew(){state.crew=(state.crew||[]).map(normalizeCrew); syncAllocationsWithCrew(true); recomputeCrewPoolsFromAllocations(); localSet('crew',state.crew||[]); localSet('allocations',state.allocations||[]); scheduleRemotePush(); if(state.tab==='travel')renderTravel()}
function crewById(id){return (state.crew||[]).find(c=>c.id===id)}
function crewDisplayName(c){return c.name?.trim() || 'Nuova scheda PG'}
function crewCard(c){let hp=(c.hpCurrent||c.hpMax)?`${esc(c.hpCurrent||'?')} / ${esc(c.hpMax||'?')}`:'—'; let active=state.selectedCrewId===c.id?' active':''; return `<button class="crew-card${active}" onclick="openCrew('${escJs(c.id)}')"><div class="crew-portrait">${c.image?`<img src="${esc(c.image)}" alt="Ritratto di ${esc(crewDisplayName(c))}">`:'✦'}</div><h3>${esc(crewDisplayName(c))}</h3><p class="muted mini">${esc(c.player||'Giocatore non indicato')}</p><p>${c.classLevel?`<span class="pill">${esc(c.classLevel)}</span>`:''} ${c.race?`<span class="pill">${esc(c.race)}</span>`:''}</p><div class="crew-stats"><div class="crew-stat"><span class="muted mini">PF</span><strong>${hp}</strong></div><div class="crew-stat"><span class="muted mini">CA</span><strong>${esc(c.ac||'—')}</strong></div><div class="crew-stat"><span class="muted mini">Vel.</span><strong>${esc(c.speed||'—')}</strong></div></div>${c.role?`<p class="muted mini" style="margin-top:10px">Ruolo: ${esc(c.role)}</p>`:''}</button>`}
function renderCrew(){let crew=state.crew||[]; let selected=state.selectedCrewId?crewById(state.selectedCrewId):null; $('#crew').innerHTML=`<div class="hero"><h1>Equipaggio <span class="versiontag">v40 scroll stabile</span></h1><p class="muted">La sezione mostra sempre la lista dei PG creati. Ogni PG possiede scorte di Ricerca/Addestramento ottenute confermando le allocazioni, e può spenderle in mini progetti personali.</p><div class="toolbar"><button class="btn primary" onclick="createCrew()">+ Crea scheda PG</button>${selected?'<button class="btn" onclick="closeCrewDetail()">Chiudi dettaglio</button>':''}</div></div><div class="crew-layout">${crewList(crew)}${selected?crewDetail(selected):'<div class="notice">Seleziona una mini scheda per aprire e modificare i dettagli del PG.</div>'}</div>`}
function crewList(crew){return `<div class="card"><div class="crew-list-header"><h2>PG della nave</h2><span class="pill">${crew.length} schede salvate</span></div>${crew.length?`<div class="crew-grid">${crew.map(crewCard).join('')}</div>`:'<p class="muted">Nessuna scheda creata. Clicca “Crea scheda PG” per aggiungere il primo membro dell’equipaggio: comparirà qui come mini scheda separata.</p>'}</div>`}
function crewInput(id,key,label,type='text',extra=''){let c=crewById(id)||{}; return `<label>${esc(label)}<input class="input" data-crew-id="${esc(id)}" data-crew-key="${esc(key)}" type="${type}" value="${esc(c[key]||'')}" ${extra} onchange="updateCrewField('${escJs(id)}','${escJs(key)}',this.value)"></label>`}
function crewDetail(c){return `<div class="crew-detail-grid"><div class="card"><div class="portrait-large">${c.image?`<img src="${esc(c.image)}" alt="Ritratto di ${esc(crewDisplayName(c))}">`:'✦'}</div><div class="toolbar" style="margin-top:12px"><input class="input" type="file" accept="image/*" onchange="uploadCrewImage('${escJs(c.id)}',this.files[0])"><button class="btn danger" onclick="removeCrewImage('${escJs(c.id)}')">Rimuovi immagine</button></div><h2>${esc(crewDisplayName(c))}</h2><p class="muted">${esc(c.classLevel||'Classe/livello non indicati')}</p><div class="crew-stats"><div class="crew-stat"><span class="muted mini">PF</span><strong>${esc(c.hpCurrent||'—')} / ${esc(c.hpMax||'—')}</strong></div><div class="crew-stat"><span class="muted mini">CA</span><strong>${esc(c.ac||'—')}</strong></div><div class="crew-stat"><span class="muted mini">Velocità</span><strong>${esc(c.speed||'—')}</strong></div></div><div class="reserve-grid"><div class="reserve-card"><span class="muted mini">Scorta Ricerca</span><br><strong>${crewReserve(c,'research')}</strong><div class="muted mini">totale ottenuto: ${crewEarned(c,'research')}</div></div><div class="reserve-card"><span class="muted mini">Scorta Addestramento</span><br><strong>${crewReserve(c,'training')}</strong><div class="muted mini">totale ottenuto: ${crewEarned(c,'training')}</div></div></div><div class="toolbar" style="margin-top:14px"><button class="btn danger" onclick="deleteCrew('${escJs(c.id)}')">Elimina scheda</button></div></div><div class="card"><h2>Dettagli PG</h2><div class="crew-form">${crewInput(c.id,'name','Nome PG')}${crewInput(c.id,'player','Giocatore')}${crewInput(c.id,'race','Specie / razza')}${crewInput(c.id,'classLevel','Classe e livello')}${crewInput(c.id,'hpCurrent','PF attuali','number','step="1"')}${crewInput(c.id,'hpMax','PF massimi','number','step="1"')}${crewInput(c.id,'ac','Classe Armatura','number','step="1"')}${crewInput(c.id,'speed','Velocità')}${crewInput(c.id,'role','Ruolo sulla nave')}${crewInput(c.id,'dndbeyond','Link D&D Beyond','url')}<div class="full"><h3>Statistiche</h3><div class="crew-ability-grid">${['str','dex','con','int','wis','cha'].map(k=>crewInput(c.id,k,k.toUpperCase(),'number','step="1"')).join('')}</div></div><label class="full">Note, capacità utili, competenze, attrezzatura importante<textarea rows="6" data-crew-id="${esc(c.id)}" data-crew-key="notes" oninput="updateCrewFieldLive('${escJs(c.id)}','notes',this.value)" onchange="updateCrewField('${escJs(c.id)}','notes',this.value)">${esc(c.notes||'')}</textarea></label>${c.dndbeyond?`<div class="full"><a class="btn" href="${esc(c.dndbeyond)}" target="_blank" rel="noopener">Apri scheda D&D Beyond</a></div>`:''}</div>${crewProjectsPanel(c)}</div></div>`}
function crewProjectsPanel(c){return `<div class="card" style="margin-top:16px"><h2>Progetti personali</h2><p class="muted mini">Crea un progetto di Ricerca o Addestramento, poi assegna punti dalla scorta del PG. Le scorte aumentano quando confermi le allocazioni PG nella sezione Viaggio.</p><div class="reserve-grid"><div class="reserve-card"><span class="muted mini">Ricerca disponibile</span><br><strong>${crewReserve(c,'research')}</strong></div><div class="reserve-card"><span class="muted mini">Addestramento disponibile</span><br><strong>${crewReserve(c,'training')}</strong></div></div><div class="project-create"><input id="projName-${esc(c.id)}" class="input" placeholder="Nome progetto"><select id="projType-${esc(c.id)}" class="select"><option value="research">Ricerca</option><option value="training">Addestramento</option></select><button class="btn primary" onclick="createCrewProject('${escJs(c.id)}')">Crea progetto</button></div><div class="project-list">${crewProjects(c).length?crewProjects(c).map(p=>projectRow(c,p)).join(''):'<p class="muted">Nessun progetto creato.</p>'}</div></div>`}
function projectRow(c,p){return `<div class="project-row"><div class="crew-list-header"><div><strong>${esc(p.name||'Progetto senza nome')}</strong><br><span class="pill">${projectTypeLabel(p.type)}</span> <span class="pill ok">${n(p.progress)} pt</span></div><button class="btn danger" onclick="deleteCrewProject('${escJs(c.id)}','${escJs(p.id)}')">Elimina</button></div><div class="toolbar" style="margin-top:8px"><input class="editable" id="projSpend-${esc(p.id)}" type="number" min="1" step="1" value="1"><button class="btn" onclick="spendCrewProject('${escJs(c.id)}','${escJs(p.id)}',Number(document.getElementById('projSpend-${esc(p.id)}').value||1))">Assegna punti</button><button class="btn" onclick="spendCrewProject('${escJs(c.id)}','${escJs(p.id)}',-Number(document.getElementById('projSpend-${esc(p.id)}').value||1))">Rimuovi punti</button></div></div>`}
window.createCrew=()=>{let c=blankCrew(); state.crew=[...(state.crew||[]),c]; state.selectedCrewId=c.id; saveCrew(); renderCrew()}
window.openCrew=(id)=>{state.selectedCrewId=id; renderCrew()}
window.closeCrewDetail=()=>{state.selectedCrewId=null; renderCrew()}
let crewLiveSaveTimer=null;
window.updateCrewField=(id,key,value)=>{let c=crewById(id); if(!c)return; c[key]=value; saveCrew(); if(['name','player','race','classLevel','hpCurrent','hpMax','ac','speed','role'].includes(key)){renderCrew();}}
window.updateCrewFieldLive=(id,key,value)=>{let c=crewById(id); if(!c)return; c[key]=value; state.crew=(state.crew||[]).map(normalizeCrew); localSet('crew',state.crew||[]); clearTimeout(crewLiveSaveTimer); crewLiveSaveTimer=setTimeout(()=>{saveCrew();},450)}
window.createCrewProject=(id)=>{let c=crewById(id); if(!c)return; let name=(document.getElementById(`projName-${id}`)?.value||'').trim(); let type=document.getElementById(`projType-${id}`)?.value||'research'; if(!name){alert('Dai un nome al progetto.');return} c.projects=Array.isArray(c.projects)?c.projects:[]; c.projects.push({id:'proj_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),name,type,progress:0}); saveCrew(); renderCrew()}
window.spendCrewProject=(id,pid,amount)=>{let c=crewById(id); if(!c)return; c.projects=Array.isArray(c.projects)?c.projects:[]; let p=c.projects.find(x=>x.id===pid); if(!p)return; amount=n(amount); if(amount===0)return; if(amount>0&&crewReserve(c,p.type)<amount){alert('Punti '+projectTypeLabel(p.type)+' insufficienti.');return} if(amount<0&&n(p.progress)+amount<0){alert('Il progetto non può scendere sotto 0.');return} p.progress=n(p.progress)+amount; saveCrew(); renderCrew()}
window.deleteCrewProject=(id,pid)=>{let c=crewById(id); if(!c)return; if(!confirm('Eliminare questo progetto? I punti assegnati torneranno disponibili nella scorta.'))return; c.projects=(Array.isArray(c.projects)?c.projects:[]).filter(p=>p.id!==pid); saveCrew(); renderCrew()}
window.deleteCrew=(id)=>{if(!confirm('Eliminare questa scheda PG?'))return; state.crew=(state.crew||[]).filter(c=>c.id!==id); state.selectedCrewId=null; saveCrew(); renderCrew()}
window.uploadCrewImage=async(id,file)=>{if(!file)return; try{setSyncStatus('Caricamento immagine…','warn'); const data=await uploadImageAsset(`crew/${id}/portrait`,file,700,700,.76); let c=crewById(id); if(!c)return; c.image=data; saveCrew(); renderCrew(); setSyncStatus('Online · immagine salvata','ok');}catch(e){console.error(e); alert(e.message||'Impossibile caricare l\'immagine del PG. Prova con un altro file.'); setSyncStatus('Errore immagine','bad');}}
window.removeCrewImage=(id)=>{let c=crewById(id); if(!c)return; c.image=''; saveCrew(); renderCrew()}
window.exportSave=()=>{const data=remotePayload(); data.exportedAt=new Date().toISOString(); const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='spelljammer-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
window.importSave=(file)=>{if(!file)return; if(!confirm('Importare questo backup e sostituire i dati condivisi online?'))return; const reader=new FileReader(); reader.onload=()=>{try{const data=JSON.parse(reader.result); applyRemoteData(data); pushRemoteNow(); alert('Backup importato e salvato online.')}catch(e){console.error(e); alert('File backup non valido.')}}; reader.readAsText(file)};

function shipTypeById(id){return SHIP_TYPES.find(t=>t.id===id)||SHIP_TYPES.find(t=>t.en===id)||SHIP_TYPES[0]}

function blankShip(){return {id:'ship_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),name:'',hp:'',type:'spacegalleon',sectionCount:1,shipImage:'',sections:[blankShipSection(1)]}}
function defaultSectionView(i){return {x:0,y:i*86,z:i,scale:1,opacity:1,visible:true}}
function blankShipSection(i){return {id:'sec_'+Date.now().toString(36)+'_'+i+'_'+Math.random().toString(36).slice(2,6),name:'Sezione '+i,image:'',notes:'',view:defaultSectionView(i-1)}}
function normalizeSectionView(v,i){v=v||{}; return {x:Number.isFinite(+v.x)?+v.x:0,y:Number.isFinite(+v.y)?+v.y:i*86,z:Number.isFinite(+v.z)?+v.z:i,scale:Number.isFinite(+v.scale)?Math.max(.25,Math.min(2.5,+v.scale)):1,opacity:Number.isFinite(+v.opacity)?Math.max(.05,Math.min(1,+v.opacity)):1,visible:v.visible===undefined?true:!!v.visible}}
function normalizeShip(s){s=s||{}; if(!s.id)s.id='ship_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7); s.name=s.name||''; s.hp=s.hp||''; s.type=shipTypeById(s.type).id; s.sectionCount=Math.max(1,Math.min(30,n(s.sectionCount)||1)); s.shipImage=s.shipImage||s.skeletonImage||''; if('skeletonImage' in s) delete s.skeletonImage; s.viewMode=s.viewMode||'exploded'; s.sections=Array.isArray(s.sections)?s.sections:[]; while(s.sections.length<s.sectionCount)s.sections.push(blankShipSection(s.sections.length+1)); if(s.sections.length>s.sectionCount)s.sections=s.sections.slice(0,s.sectionCount); s.sections=s.sections.map((x,i)=>({id:x.id||blankShipSection(i+1).id,order:Math.max(1,n(x.order)||i+1),name:x.name||('Sezione '+(i+1)),image:x.image||'',notes:x.notes||'',view:normalizeSectionView(x.view,i)})).sort((a,b)=>(n(a.order)||0)-(n(b.order)||0)); s.sections.forEach((x,i)=>{x.order=i+1; x.view=normalizeSectionView(x.view,i)}); return s}
function saveFleet(){
  state.fleet=(state.fleet||[]).map(normalizeShip);
  localSet('fleet',state.fleet);
  if(remoteRef&&remoteReady&&!applyingRemote){
    remoteRef.update({fleet:state.fleet||[],updatedAt:new Date().toISOString(),appVersion:'v37_image_persistence_fix'})
      .then(()=>{setSyncStatus('Online · flotta salvata','ok')})
      .catch(e=>{console.error(e);setSyncStatus('Errore salvataggio flotta','bad')});
  }else{
    scheduleRemotePush();
  }
}
function mergeIncomingFleetWithPendingLocalImages(incoming){
  const local=Array.isArray(state.fleet)?state.fleet:[];
  const localById=Object.fromEntries(local.map(s=>[s.id,s]));
  return (incoming||[]).map(raw=>{
    const s=normalizeShip(raw);
    const old=localById[s.id];
    if(old&&pendingFleetImageKeys.has(fleetImageKey(s.id))){
      if(!s.shipImage&&old.shipImage)s.shipImage=old.shipImage;
      if(s.shipImage===old.shipImage)pendingFleetImageKeys.delete(fleetImageKey(s.id));
    }
    const oldSections=Object.fromEntries(((old&&old.sections)||[]).map(sec=>[sec.id,sec]));
    s.sections=(s.sections||[]).map((sec,i)=>{
      const oldSec=oldSections[sec.id];
      const k=fleetImageKey(s.id,sec.id);
      if(oldSec&&pendingFleetImageKeys.has(k)){
        if(!sec.image&&oldSec.image)sec.image=oldSec.image;
        if(sec.image===oldSec.image)pendingFleetImageKeys.delete(k);
      }
      return sec;
    });
    return normalizeShip(s);
  });
}
window.updateShipSection=(id,secId,key,value)=>{
  let s=shipById(id); if(!s)return;
  let sec=(s.sections||[]).find(x=>x.id===secId); if(!sec)return;
  if(key==='order')sec.order=Math.max(1,Math.min(30,n(value)||1));
  else sec[key]=value;
  normalizeShip(s);
  saveFleet();
  renderFleet();
  renderShipViewer();
}

function imageDataUrlCompressed(file,maxW=1200,maxH=850,quality=.78,targetChars=650000){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){reject(new Error('Seleziona un file immagine valido.'));return;}
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const make=(w,h,q)=>{
            const canvas=document.createElement('canvas');
            canvas.width=Math.max(1,Math.round(w));
            canvas.height=Math.max(1,Math.round(h));
            const ctx=canvas.getContext('2d');
            ctx.drawImage(img,0,0,canvas.width,canvas.height);
            return canvas.toDataURL('image/jpeg',q);
          };
          let w=img.width, h=img.height;
          let scale=Math.min(1,maxW/w,maxH/h);
          let q=quality;
          let dataUrl=make(w*scale,h*scale,q);
          // Compressione adattiva: riduce qualità e poi dimensioni finché il DB riesce a gestirla meglio.
          let guard=0;
          while(dataUrl.length>targetChars && guard<18){
            if(q>.48){ q=Math.max(.48,q-.08); }
            else { scale*=.84; }
            dataUrl=make(w*scale,h*scale,q);
            guard++;
          }
          if(dataUrl.length>targetChars*1.6){
            reject(new Error('Immagine troppo grande anche dopo la compressione. Prova con un file più piccolo o meno dettagliato.'));
            return;
          }
          resolve(dataUrl);
        }catch(e){reject(e)}
      };
      img.onerror=()=>reject(new Error('Formato immagine non leggibile.'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('Impossibile leggere il file immagine.'));
    reader.readAsDataURL(file);
  });
}
async function uploadImageAsset(path,file,maxW=1200,maxH=850,quality=.78){
  // v35: niente Firebase Storage. Salviamo un JPEG compresso nel Realtime Database.
  // Questo evita il blocco CORS/preflight visto su GitHub Pages.
  return await imageDataUrlCompressed(file,maxW,maxH,quality,650000);
}

function shipViewerLayer(sec,i,mode){
  const v=normalizeSectionView(sec.view,i);
  if(!v.visible)return '';
  const autoY=mode==='compact'?0:i*58;
  const autoX=mode==='compact'?0:i*18;
  const x=(v.x||0)+autoX;
  const y=(v.y||0)+(mode==='compact'?0:autoY);
  const z=100+i+(n(v.z)||0);
  const scale=v.scale||1;
  const opacity=v.opacity??1;
  const img=sec.image||'';
  return `<div class="deck-layer" style="z-index:${z};opacity:${opacity};transform:translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})">${img?`<img src="${esc(img)}" alt="${esc(sec.name||'Sezione')}">`:`<div class="section-image" style="height:210px;margin:0">${esc(sec.name||('Sezione '+(i+1)))}</div>`}<span class="deck-label">${esc(sec.order||i+1)} · ${esc(sec.name||('Sezione '+(i+1)))}</span></div>`
}

function renderReference(){
  const S = (APP_DATA && APP_DATA.spelljammer) || {};
  const C = (APP_DATA && APP_DATA.crafting) || {};
  const safeGrid = (data)=>{ try{return gridTable(data||[])}catch(e){return '<p class="muted">Nessun dato disponibile.</p>'} };
  const safeTable = (data)=>{ try{return table(data||[])}catch(e){return '<p class="muted">Nessun dato disponibile.</p>'} };
  $('#reference').innerHTML=`<div class="hero"><h1>Riferimenti Excel</h1><p class="muted">Tabelle importate dal sistema originale.</p><span class="versiontag">v33 reference fix</span></div><div class="grid"><div class="card"><h2>Panoramica</h2>${safeGrid(S.panoramica)}</div><div class="card"><h2>Soglie</h2>${safeGrid(S.soglie_grid)}</div><div class="card"><h2>Guida equipaggiamento</h2>${safeTable(C.equipment)}</div><div class="card"><h2>Monete</h2>${safeTable(C.coins)}</div></div>`;
}

function renderSection(id){({dashboard:renderDashboard,travel:renderTravel,events:renderEvents,crafting:renderCrafting,recipes:renderRecipes,inventory:renderInventory,crew:renderCrew,fleet:renderFleet,reference:renderReference}[id]||renderDashboard)()}
function refreshCurrent(){const _scrolls=captureTableScrolls(); try{renderSection(state.tab||'dashboard'); renderShipViewer()}catch(e){console.error(e)} restoreTableScrolls(_scrolls); updateAllTableScrollHints();}
function applyRemoteData(data){applyingRemote=true; try{
  if(data.routeLog!==undefined){state.log=Array.isArray(data.routeLog)?data.routeLog:[]; store.localSet('routeLog',state.log)}
  if(data.inventory!==undefined){state.inventory=data.inventory&&typeof data.inventory==='object'?data.inventory:{}; store.localSet('inventory',state.inventory)}
  if(data.wallet!==undefined){state.wallet=Object.assign({cp:0,sp:0,gp:0,pp:0},data.wallet||{}); store.localSet('wallet',state.wallet)}
  if(data.travelSettings!==undefined){state.travelSettings=Object.assign(defaultTravelSettings(),data.travelSettings||{}); store.localSet('travelSettings',state.travelSettings)}
  if(data.turns!==undefined){state.turns=Array.isArray(data.turns)?data.turns:null; store.localSet('turns',state.turns)}
  if(data.allocations!==undefined){state.allocations=Array.isArray(data.allocations)?data.allocations:null; store.localSet('allocations',state.allocations)}
  if(data.crew!==undefined){let incoming=(Array.isArray(data.crew)?data.crew:[]).map(normalizeCrew); const active=activeCrewEdit(); if(active){let edited=incoming.find(c=>c.id===active.id); if(edited)edited[active.key]=active.value;} state.crew=incoming; store.localSet('crew',state.crew); if(state.selectedCrewId&&!state.crew.some(c=>c.id===state.selectedCrewId))state.selectedCrewId=null}
  if(data.fleet!==undefined){state.fleet=mergeIncomingFleetWithPendingLocalImages(Array.isArray(data.fleet)?data.fleet:[]); store.localSet('fleet',state.fleet); if(state.selectedShipId&&!state.fleet.some(s=>s.id===state.selectedShipId))state.selectedShipId=null}
  if(Array.isArray(state.turns))syncAllocationsWithCrew(false); recomputeCrewPoolsFromAllocations(); localSet('crew',state.crew||[]);
} finally {applyingRemote=false} safeRefreshCurrent();}
function initRealtimeSync(){
  if(!window.firebase){setSyncStatus('Firebase non caricato','bad'); return}
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
    storage=null; // v35: immagini salvate direttamente nel Realtime Database per evitare problemi CORS/Storage
    remoteRef=db.ref(REMOTE_PATH);
    const connectedRef=db.ref('.info/connected');
    connectedRef.on('value',snap=>setSyncStatus(snap.val()?'Online · sync attiva':'Offline',''+(snap.val()?'ok':'bad')));
    remoteRef.on('value',snap=>{
      const data=snap.val();
      remoteReady=true;
      if(data){applyRemoteData(data);}
      else {initTravelState(); pushRemoteNow();}
    },err=>{console.error(err);setSyncStatus('Permessi Firebase','bad')});
  }catch(e){console.error(e);setSyncStatus('Errore Firebase','bad')}
}
try{initNav(); renderDashboard(); initRealtimeSync();}catch(e){console.error(e); document.body.insertAdjacentHTML('beforeend',"<div class=\"notice\" style=\"position:fixed;left:20px;right:20px;bottom:20px;z-index:9999\">Errore di avvio della web app. Apri la console e inviami l'errore.</div>");}
</script>

<script>
// v40: stable horizontal table scrolling on mobile/touch devices
function updateAllTableScrollHints(){
  document.querySelectorAll('.tablewrap').forEach(function(w){
    var atEnd = Math.ceil(w.scrollLeft + w.clientWidth) >= w.scrollWidth - 2;
    w.classList.toggle('is-at-end', atEnd);
  });
}
(function(){
  function onPossibleTableScrollStart(e){
    var w = e.target && e.target.closest ? e.target.closest('.tablewrap') : null;
    if(!w) return;
    w.classList.add('scrolling-touch');
    markTableScrollActive();
  }
  function onTableScroll(e){
    var w = e.target && e.target.classList && e.target.classList.contains('tablewrap') ? e.target : null;
    if(!w) return;
    markTableScrollActive();
    updateAllTableScrollHints();
  }
  function clearScrollingClass(){
    setTimeout(function(){document.querySelectorAll('.tablewrap.scrolling-touch').forEach(function(w){w.classList.remove('scrolling-touch')});},700);
  }
  document.addEventListener('touchstart', onPossibleTableScrollStart, {passive:true, capture:true});
  document.addEventListener('touchmove', onPossibleTableScrollStart, {passive:true, capture:true});
  document.addEventListener('pointerdown', onPossibleTableScrollStart, {passive:true, capture:true});
  document.addEventListener('scroll', onTableScroll, true);
  document.addEventListener('touchend', clearScrollingClass, {passive:true});
  document.addEventListener('pointerup', clearScrollingClass, {passive:true});
  window.addEventListener('resize', updateAllTableScrollHints);
  setTimeout(updateAllTableScrollHints,250);
})();
</script>
